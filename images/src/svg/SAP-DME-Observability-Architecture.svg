<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="455" viewBox="0 0 1010 455" role="img" aria-label="Multiple instances each of SAP DME, SAP EIC, SAP hybrid application and non-SAP clusters send telemetry through the SUSE Observability Agent to a central SUSE Observability cluster">
  <title>SUSE Observability for SAP workload clusters</title>

  <style>
    .card   { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
    .bar    { fill: #0C322C; }
    .bar-tx { fill: #FFFFFF; font-size: 15px; font-weight: 700; }
    .node   { stroke-width: 1; }
    .green  { fill: #E6F4EA; stroke: #6BCC9E; }
    .orange { fill: #FFF5F0; stroke: #FFAF8B; }
    .grey   { fill: #F1F5F9; stroke: #94A3B8; }
    .node-tx{ fill: #0C322C; font-size: 12px; font-weight: 700; }
    .sub-tx { fill: #64748B; font-size: 11px; font-weight: 500; }
    .label  { fill: #64748B; font-size: 13px; font-weight: 500; }
    .small  { fill: #64748B; font-size: 11px; font-weight: 500; }
    .start  { text-anchor: start; }
    .flow   { fill: none; stroke: #64748B; stroke-width: 1; stroke-dasharray: 4 3; }
    .head   { fill: #64748B; }
    text    { font-family: "Plus Jakarta Sans", "Poppins", "Nunito Sans", "Segoe UI", system-ui, sans-serif;
              text-anchor: middle; }
  </style>

  <rect width="1010" height="455" fill="#FFFFFF"/>

  <!-- ===== SUSE Observability Cluster ===== -->
  <g transform="translate(55 0)">
    <rect class="card" x="150.5" y="1.5" width="599" height="129" rx="8"/>
    <path class="bar" d="M150.5 34 V9.5 a8 8 0 0 1 8 -8 H741.5 a8 8 0 0 1 8 8 V34 Z"/>
    <text class="bar-tx" x="450" y="23.5">SUSE Observability Cluster</text>

    <rect class="node green" x="165.5" y="45.5" width="180" height="72" rx="7"/>
    <text class="node-tx" x="255.5" y="78">Receiver</text>
    <text class="sub-tx"  x="255.5" y="94">Ingest API</text>

    <rect class="node green" x="360.5" y="45.5" width="180" height="72" rx="7"/>
    <text class="node-tx" x="450.5" y="78">Topology, Metrics</text>
    <text class="sub-tx"  x="450.5" y="94">Events, Logs &amp; Traces</text>

    <rect class="node green" x="555.5" y="45.5" width="180" height="72" rx="7"/>
    <text class="node-tx" x="645.5" y="78">UI &amp; API</text>
    <text class="sub-tx"  x="645.5" y="94">Monitors, Alerting</text>
  </g>

  <!-- ===== Connectors (agents -> receiver) ===== -->
  <g>
    <path class="flow" d="M122.5 205 V172.5 H872.5 V205"/>
    <path class="flow" d="M372.5 205 V172.5"/>
    <path class="flow" d="M622.5 205 V172.5"/>
    <path class="flow" d="M310.5 172.5 V139"/>
    <path class="head" d="M307.0 139 H314.0 L310.5 132.5 Z"/>
    <text class="label start" x="322.0" y="157">Telemetry via HTTPS</text>
    <text class="small start" x="465.0" y="157">(metrics, events, logs, traces, topology)</text>
  </g>
  <!-- ===== SAP DME ===== -->
  <g>
    <!-- additional instances (stacked) -->
    <g opacity="0.55">
      <rect class="card" x="22.5" y="217.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M22.5 250.0 V225.5 a8 8 0 0 1 8 -8 H239.5 a8 8 0 0 1 8 8 V250.0 Z"/>
    </g>
    <g opacity="0.8">
      <rect class="card" x="16.5" y="211.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M16.5 244.0 V219.5 a8 8 0 0 1 8 -8 H233.5 a8 8 0 0 1 8 8 V244.0 Z"/>
    </g>

    <rect class="card" x="10.5" y="205.5" width="225" height="195" rx="8"/>
    <path class="bar" d="M10.5 238.0 V213.5 a8 8 0 0 1 8 -8 H227.5 a8 8 0 0 1 8 8 V238.0 Z"/>
    <text class="bar-tx" x="122.5" y="227.5">SAP DME</text>

    <rect class="node green" x="23.5" y="248.5" width="199" height="44" rx="7"/>
    <text class="node-tx" x="122.5" y="275">SUSE Observability Agent</text>

    <path class="flow" d="M122.5 315 V299"/>
    <path class="head" d="M119.0 299 H126.0 L122.5 292.5 Z"/>
    <text class="small start" x="132.5" y="308">collects</text>

    <rect class="node orange" x="23.5" y="315.5" width="199" height="72" rx="7"/>
    <text class="node-tx" x="122.5" y="348">SAP Workload</text>
    <text class="sub-tx"  x="122.5" y="364">Pods, Services, Volumes</text>
  </g>
  <!-- ===== SAP EIC ===== -->
  <g>
    <!-- additional instances (stacked) -->
    <g opacity="0.55">
      <rect class="card" x="272.5" y="217.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M272.5 250.0 V225.5 a8 8 0 0 1 8 -8 H489.5 a8 8 0 0 1 8 8 V250.0 Z"/>
    </g>
    <g opacity="0.8">
      <rect class="card" x="266.5" y="211.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M266.5 244.0 V219.5 a8 8 0 0 1 8 -8 H483.5 a8 8 0 0 1 8 8 V244.0 Z"/>
    </g>

    <rect class="card" x="260.5" y="205.5" width="225" height="195" rx="8"/>
    <path class="bar" d="M260.5 238.0 V213.5 a8 8 0 0 1 8 -8 H477.5 a8 8 0 0 1 8 8 V238.0 Z"/>
    <text class="bar-tx" x="372.5" y="227.5">SAP EIC</text>

    <rect class="node green" x="273.5" y="248.5" width="199" height="44" rx="7"/>
    <text class="node-tx" x="372.5" y="275">SUSE Observability Agent</text>

    <path class="flow" d="M372.5 315 V299"/>
    <path class="head" d="M369.0 299 H376.0 L372.5 292.5 Z"/>
    <text class="small start" x="382.5" y="308">collects</text>

    <rect class="node orange" x="273.5" y="315.5" width="199" height="72" rx="7"/>
    <text class="node-tx" x="372.5" y="348">SAP Workload</text>
    <text class="sub-tx"  x="372.5" y="364">Pods, Services, Volumes</text>
  </g>
  <!-- ===== SAP hybrid application ===== -->
  <g>
    <!-- additional instances (stacked) -->
    <g opacity="0.55">
      <rect class="card" x="522.5" y="217.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M522.5 250.0 V225.5 a8 8 0 0 1 8 -8 H739.5 a8 8 0 0 1 8 8 V250.0 Z"/>
    </g>
    <g opacity="0.8">
      <rect class="card" x="516.5" y="211.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M516.5 244.0 V219.5 a8 8 0 0 1 8 -8 H733.5 a8 8 0 0 1 8 8 V244.0 Z"/>
    </g>

    <rect class="card" x="510.5" y="205.5" width="225" height="195" rx="8"/>
    <path class="bar" d="M510.5 238.0 V213.5 a8 8 0 0 1 8 -8 H727.5 a8 8 0 0 1 8 8 V238.0 Z"/>
    <text class="bar-tx" x="622.5" y="227.5">SAP hybrid application</text>

    <rect class="node green" x="523.5" y="248.5" width="199" height="44" rx="7"/>
    <text class="node-tx" x="622.5" y="275">SUSE Observability Agent</text>

    <path class="flow" d="M622.5 315 V299"/>
    <path class="head" d="M619.0 299 H626.0 L622.5 292.5 Z"/>
    <text class="small start" x="632.5" y="308">collects</text>

    <rect class="node orange" x="523.5" y="315.5" width="199" height="72" rx="7"/>
    <text class="node-tx" x="622.5" y="348">SAP Workload</text>
    <text class="sub-tx"  x="622.5" y="364">Pods, Services, Volumes</text>
  </g>
  <!-- ===== non-SAP clusters ===== -->
  <g>
    <!-- additional instances (stacked) -->
    <g opacity="0.55">
      <rect class="card" x="772.5" y="217.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M772.5 250.0 V225.5 a8 8 0 0 1 8 -8 H989.5 a8 8 0 0 1 8 8 V250.0 Z"/>
    </g>
    <g opacity="0.8">
      <rect class="card" x="766.5" y="211.5" width="225" height="195" rx="8"/>
      <path class="bar" d="M766.5 244.0 V219.5 a8 8 0 0 1 8 -8 H983.5 a8 8 0 0 1 8 8 V244.0 Z"/>
    </g>

    <rect class="card" x="760.5" y="205.5" width="225" height="195" rx="8"/>
    <path class="bar" d="M760.5 238.0 V213.5 a8 8 0 0 1 8 -8 H977.5 a8 8 0 0 1 8 8 V238.0 Z"/>
    <text class="bar-tx" x="872.5" y="227.5">non-SAP clusters</text>

    <rect class="node green" x="773.5" y="248.5" width="199" height="44" rx="7"/>
    <text class="node-tx" x="872.5" y="275">SUSE Observability Agent</text>

    <path class="flow" d="M872.5 315 V299"/>
    <path class="head" d="M869.0 299 H876.0 L872.5 292.5 Z"/>
    <text class="small start" x="882.5" y="308">collects</text>

    <rect class="node grey" x="773.5" y="315.5" width="199" height="72" rx="7"/>
    <text class="node-tx" x="872.5" y="348">Non-SAP Workload</text>
    <text class="sub-tx"  x="872.5" y="364">Pods, Services, Volumes</text>
  </g>
  <!-- ===== Legend ===== -->
  <g transform="translate(-30 0)">
    <rect class="node green" x="300.5" y="431.5" width="14" height="14" rx="3"/>
    <text class="small start" x="321" y="442.5">SUSE Observability components</text>
    <rect class="node orange" x="520.5" y="431.5" width="14" height="14" rx="3"/>
    <text class="small start" x="541" y="442.5">SAP workload</text>
    <rect class="node grey" x="650.5" y="431.5" width="14" height="14" rx="3"/>
    <text class="small start" x="671" y="442.5">Non-SAP workload</text>
  </g>
</svg>
